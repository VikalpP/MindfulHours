name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste screenshots, window titles or timeline entries that contain private information**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MindfulHours version
      description: Shown in Finder › Get Info on MindfulHours.app, or the commit you built from.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1 (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tracking (apps, titles, URLs, idle)
        - AI descriptions / model provider
        - Privacy protections
        - Timeline / menu bar UI
        - Install / permissions
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Optional: `log show --last 10m --predicate 'process == \"MindfulHours\"'` — review for private data before pasting."
      render: text
