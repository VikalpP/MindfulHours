name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build & publish release
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Optional. Without these, the release is ad-hoc signed and not notarized.
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12_BASE64 != ''
        run: scripts/ci/import-signing-certificate.sh

      - name: Build universal app
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY || '-' }}
        run: scripts/build-app.sh --universal --version "$VERSION" --build-number "${{ github.run_number }}"

      - name: Notarize and staple
        if: env.DEVELOPER_ID_P12_BASE64 != '' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent build/MindfulHours.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple build/MindfulHours.app

      - name: Package
        run: scripts/package-release.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ env.DEVELOPER_ID_P12_BASE64 != '' && env.APPLE_ID != '' }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            install_note="Signed with Developer ID and notarized by Apple."
          else
            install_note="**This build is not notarized.** After moving MindfulHours to Applications, open it once, then go to System Settings › Privacy & Security and click **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/MindfulHours.app\`). macOS will ask for Accessibility and Screen Recording again after each update."
          fi
          prerelease_flag=()
          [[ "$VERSION" == *-* ]] && prerelease_flag=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MindfulHours $VERSION" \
            --notes "$(printf '## Install\n\nDownload the DMG, drag MindfulHours to Applications.\n\n%s\n\nVerify downloads with `SHA256SUMS.txt`.\n' "$install_note")" \
            --generate-notes \
            ${prerelease_flag[@]+"${prerelease_flag[@]}"}
